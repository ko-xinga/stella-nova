<html>
  <head>
    <title>Stella Nova's Fansite &#x2606;</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
    <meta charset="UTF-8" />
  </head>
  <!-- Body -->
  <body>
    <div id="navbar">
      <h1>░ Stella Nova's Fansite ░</h1>
    </div>

    <div class="article">
      <hr class="hrStyleTop" />
      <h3>Welcome to my fansite! ♫</h3>
      <p>
        Step into the radiant orbit of
        <span class="wiredAnim"><b>Stella Nova</b></span> - the galaxy's
        brightest, upcoming songstress!
      </p>

      <p style="font-size: 12px">Check out her latest single!</font></p>

      <div id="musicplayer">
        <div class="title-color">
          <div class="actual-title">
            <img
              src="https://loveberry.nekoweb.org/assets/musicplayer/player-icon.png"
              alt=""
              height="14px"
              width="14px"
            />
            CD Player
          </div>
          <div class="title-bar-controls">
            <div class="window-button minimize"></div>
            <div class="window-button maximize"></div>
            <div class="window-button close"></div>
          </div>
        </div>
        <div class="player-flex">
          <div class="player-icon-holder">
            <div class="player-icon"></div>
          </div>
          <div class="player-main">
            <select class="track-select"></select>
            <div class="controls">
              <div class="seeking">
                <div class="current-time">00:00</div>

                <input
                  type="range"
                  min="1"
                  max="100"
                  value="0"
                  class="seek_slider"
                  onchange="seekTo()"
                />

                <div class="total-duration">0:00</div>
              </div>

              <div class="player-buttons">
                <button class="window-button prev-track" onclick="prevTrack()">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-skip-back-icon lucide-skip-back"
                  >
                    <path
                      d="M17.971 4.285A2 2 0 0 1 21 6v12a2 2 0 0 1-3.029 1.715l-9.997-5.998a2 2 0 0 1-.003-3.432z"
                    />
                    <path d="M3 20V4" />
                  </svg>
                </button>

                <button
                  class="window-button playpause-track"
                  onclick="playpauseTrack()"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-play-icon lucide-play"
                  >
                    <path
                      d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"
                    />
                  </svg>
                </button>

                <button class="window-button next-track" onclick="nextTrack()">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-skip-forward-icon lucide-skip-forward"
                  >
                    <path d="M21 4v16" />
                    <path
                      d="M6.029 4.285A2 2 0 0 0 3 6v12a2 2 0 0 0 3.029 1.715l9.997-5.998a2 2 0 0 0 .003-3.432z"
                    />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>

        <audio id="music" src=""></audio>
      </div>
    </div>

    <!-- Scripts -->
    <script src="index.js"></script>
  </body>
</html>
